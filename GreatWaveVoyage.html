<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GreatWaveVoyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a woodblock print you can sail through; quiet, inky, flat colour.
   IDEA: the HUD is a printed cartouche (title slip) pasted on the print.
   PICTURE: the full-screen WebGL2 scene made only of brush strokes.
   COLOUR and TYPE: Prussian blue, indigo, pale blue, cream paper; Shippori Mincho.
   LAYOUT: cartouche top-left, controls top-right, joystick and jump on touch. */
:root{color-scheme:light;--paper:#efe4c8;--ink:#1c2a4e;--pb:#1b4469;--pale:#a8c4cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.4 "Shippori Mincho",Georgia,serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.slip{position:fixed;background:rgba(239,228,200,.92);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(28,42,78,.35);padding:8px 12px}
#title{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));max-width:min(330px,60vw)}
#title h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em;line-height:1.1}
#count{font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
#count b{color:#9a6a12}
#hint{font-size:13px;opacity:.8;margin-top:2px}
#ctl{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:6px;max-width:58vw}
button{font:600 14px "Shippori Mincho",Georgia,serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);min-height:40px;padding:0 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--pb);color:var(--paper)}
button:focus-visible{outline:3px solid #b8392b;outline-offset:2px}
#stats{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 58px);font-size:13px;color:var(--ink);background:rgba(239,228,200,.8);padding:2px 8px;border:1px solid rgba(28,42,78,.4);font-variant-numeric:tabular-nums}
#help{bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:13px;text-align:center;white-space:nowrap}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font:800 22px "Shippori Mincho",serif;color:var(--paper);background:var(--pb);padding:6px 16px;border:2px solid var(--ink);opacity:0;transition:opacity .4s;pointer-events:none}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;border:2px solid var(--ink);background:rgba(239,228,200,.45);display:none;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:var(--pb);border:2px solid var(--ink)}
#jumpBtn{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;font-size:18px;display:none;background:rgba(239,228,200,.8);touch-action:none}
body.touch #joy,body.touch #jumpBtn{display:block}
body.touch #help{display:none}
#err{position:fixed;left:12px;bottom:12px;max-width:80vw;background:#fff;color:#900;border:2px solid #900;padding:8px;display:none;font:13px monospace;white-space:pre-wrap}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:800 28px "Shippori Mincho",serif;color:var(--ink);background:var(--paper);transition:opacity .6s}
@media(max-width:600px){#title{max-width:none;right:max(12px,env(safe-area-inset-right))}#title h1{font-size:17px}#hint{display:none}button{font-size:13px;padding:0 9px}#ctl{top:calc(max(12px,env(safe-area-inset-top)) + 70px);padding:4px}#stats{font-size:11px;top:calc(max(12px,env(safe-area-inset-top)) + 122px)}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="GreatWaveVoyage scene"></canvas>
<div id="title" class="slip"><h1>GreatWaveVoyage</h1><div id="count">Fish aboard <b id="aboard">0</b> · delivered <b id="deliv">0</b></div><div id="hint">Collect golden fish, bring them to the village pier.</div></div>
<div id="ctl" class="slip"><button id="bAuto" aria-pressed="true">Autopilot</button><button id="bTour" aria-pressed="false">Camera tour</button></div>
<div id="stats">starting…</div>
<div id="help" class="slip">W A S D steer · Shift row faster · Space jump · drag to look · wheel to zoom · P autopilot · C tour</div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">Jump</button>
<div id="err"></div>
<div id="load">Carving the woodblocks…</div>
<script type="module">

// ---------- shared noise / waves / terrain (mirrored in GLSL)
function hashu(x){ x >>>= 0; x ^= x >>> 16; x = Math.imul(x, 0x7feb352d) >>> 0; x ^= x >>> 15; x = Math.imul(x, 0x846ca68b) >>> 0; x ^= x >>> 16; return x >>> 0; }

  return hashu((Math.imul(ux, 0x9E3779B1) >>> 0) ^ hashu((uy + Math.imul(s, 0x85EBCA77)) >>> 0)) / 4294967296; }

const WAVES = [[78, 2.0, 0.0], [47, 1.15, 0.32], [31, 0.7, -0.38], [19, 0.38, 0.72], [11, 0.2, -0.85], [6.5, 0.1, 0.18]].map(([L, A, a], i) => {

let VIL = [1e6, 1e6];
function terrainH(x, z){
  const r = Math.hypot(x, z); let h = -45;
  if (r < 1260){
    const a = Math.atan2(z, x);
    const shore = 1000 + 50 * Math.sin(3 * a + 1.3) + 28 * Math.sin(5 * a + 0.4) + 60 * (vnoise(x * 0.004, z * 0.004, 1) - 0.5);
    const e = shore - r, t = Math.max(0, 1 - r / 760);

    const lumps = (vnoise(x * 0.01, z * 0.01, 4) - 0.5) * 40 * smooth(20, 250, e) * (1 - smooth(350, 700, e));

    if (e > 18) h = Math.max(h, 7 * smooth(18, 45, e));

  }

    const a2 = Math.atan2(x, -z), sect = smooth(2.0, 1.2, Math.abs(a2));
    const r1 = 3300 + 140 * Math.sin(a2 * 5 + 0.7), r2 = 4450 + 200 * Math.sin(a2 * 3 + 2.1);
    const q1 = (r - r1) / 280, q2 = (r - r2) / 420;
    const h1 = (55 + 70 * vnoise(a2 * 6, 0.5, 5)) * Math.exp(-q1 * q1), h2 = (120 + 120 * vnoise(a2 * 4, 1.5, 6)) * Math.exp(-q2 * q2);
    h = Math.max(h, Math.max(h1, h2) * sect - 14);
  }
  return h;
}
const GLSL_COMMON = `#version 300 es
precision highp float; precision highp int;
layout(location=0) in vec2 aCorner;
uniform mat4 uVP; uniform vec3 uCam; uniform float uTime, uFocal, uMinPx, uMaxPx, uFC, uSQKA; uniform vec3 uSun;
uniform vec3 uPal[40]; uniform vec2 uVil; uniform vec4 uWA[6]; uniform vec4 uWB[6]; uniform int uNoHaze;
out vec2 vUV; flat out vec3 vCol; flat out float vSeed; flat out float vFade; flat out float vPix;
uint hashu(uint x){ x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return x; }
float hash2i(ivec2 c, uint s){ uvec2 u = uvec2(c + ivec2(1048576)); return float(hashu((u.x * 0x9E3779B1u) ^ hashu(u.y + s * 0x85EBCA77u))) / 4294967296.0; }
float vnoise(vec2 p, uint s){ vec2 i = floor(p); vec2 f = p - i; ivec2 c = ivec2(i); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash2i(c, s), hash2i(c + ivec2(1,0), s), f.x), mix(hash2i(c + ivec2(0,1), s), hash2i(c + ivec2(1,1), s), f.x), f.y); }
float h1f(float p){ p = fract(p*0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float terrainH(vec2 p){
  float r = length(p); float h = -45.0;
  if (r < 1260.0){
    float a = atan(p.y, p.x);
    float shore = 1000.0 + 50.0*sin(3.0*a + 1.3) + 28.0*sin(5.0*a + 0.4) + 60.0*(vnoise(p*0.004, 1u) - 0.5);
    float e = shore - r; float t = max(0.0, 1.0 - r/760.0);
    float fuji = min(250.0*pow(t, 2.1), 238.0);
    float coastW = 1.0 - smoothstep(0.0, 140.0, abs(e));
    float rocks = (vnoise(p*0.045, 2u)*0.65 + vnoise(p*0.13, 3u)*0.35 - 0.47)*16.0*coastW;
    float lumps = (vnoise(p*0.01, 4u) - 0.5)*40.0*smoothstep(20.0, 250.0, e)*(1.0 - smoothstep(350.0, 700.0, e));
    h = fuji + 10.0*smoothstep(-20.0, 35.0, e) - 5.0 + min(e + 20.0, 0.0)*0.35 + rocks + lumps;
    if (e > 18.0) h = max(h, 7.0*smoothstep(18.0, 45.0, e));

float seaY(vec2 x0){ float y = 0.0; for (int i = 0; i < 6; i++){ y += uWA[i].w*sin(uWA[i].z*dot(uWA[i].xy, x0) - uWB[i].y*uTime + uWB[i].z); } return y; }

const FIELD_VS = `
uniform float uS; uniform ivec2 uOrig; uniform int uN; uniform vec4 uBand; uniform int uLayer; uniform uint uSeedL;

  const obsList = obstacles.map(o => ({ x: o.x, y: o.y, z: o.z, r: o.r, top: o.top, type: o.type, yaw: o.yaw }));
  phys.step(Math.min(dt, 1/20), c, obsList);
  const ps = phys.pose(); Object.assign(boat, ps);
  boat.row += dt * (c.thrust !== 0 ? (c.boost ? 5.2 : 3.4) : 1.2);
  if (ps.landing > 2.5) splash(boat.x, boat.y, boat.z, Math.round(40 * PMAX / 5000) + 10, clamp(ps.landing / 7, 0.5, 1.4));
  if (Math.abs(boat.speed) > 2 && rnd() < 0.9){ const fx = Math.sin(boat.yaw), fz = Math.cos(boat.yaw);
    for (const sx of [1, -1]) emit(boat.x - fx * 2.4 + fz * 0.6 * sx, boat.y, boat.z - fz * 2.4 - fx * 0.6 * sx, fz * sx * 0.8, 0, -fx * sx * 0.8, rr(2, 4), rr(0.2, 0.4), 1);
    if (!boat.air && rnd() < 0.5) emit(boat.x + fx * 2.8, boat.y + 0.2, boat.z + fz * 2.8, fx * boat.speed * 0.6 + rr(-1.5, 1.5), rr(1, 2.5), fz * boat.speed * 0.6 + rr(-1.5, 1.5), rr(0.5, 1), rr(0.1, 0.2), 0); }
  setObj(OBJ.player, [boat.x, boat.y, boat.z], boat.q, 1, boat.row, 1);
  // obstacles
  const ba = Math.atan2(boat.z, boat.x);
  for (const o of obstacles){
    const rel = wrapA(Math.atan2(o.z, o.x) - ba) * 1250, far = Math.hypot(o.x - boat.x, o.z - boat.z);
    if (rel < -150 || far > 700) spawnAhead(o, 250, 520, 18);
    o.vis = Math.min(1, o.vis + dt * 0.7); const s = seaAt(o.x, o.z, simT); o.y = s.y + heroLift(o.x, o.z) + (o.type === 'log' ? 0.05 : -0.05); o.top = o.y + (o.type === 'log' ? 0.45 : 1.0);
    o.yaw += dt * 0.05; setObj(o.id, [o.x, o.y, o.z], qmul(quatYPR(o.yaw, 0, 0), [s.nz * 0.4, 0, -s.nx * 0.4, 1].map((v, i, a) => v / Math.hypot(...a))), 1, simT, o.vis); }
  // fish
  for (const f of fishes){
    if (!f.active){ f.vis = Math.max(0, f.vis - dt * 2.5); f.timer -= dt; if (f.timer <= 0){ spawnAhead(f, 200, 520, 22); f.active = true; } }
    else { f.vis = Math.min(1, f.vis + dt * 0.8); const rel = wrapA(Math.atan2(f.z, f.x) - ba) * 1250, far = Math.hypot(f.x - boat.x, f.z - boat.z); if (rel < -160 || far > 750){ spawnAhead(f, 250, 520, 22); } }
    const ph = (simT + f.t0) % 4.5, jumpH = ph < 0.9 ? Math.sin(ph / 0.9 * PI) * 1.3 : 0;
    f.y = seaAt(f.x, f.z, simT).y + 0.1 + jumpH; f.yaw = (f.yaw || 0) + dt * 0.4;
    const pitch = ph < 0.9 ? -Math.cos(ph / 0.9 * PI) * 0.7 : 0;
    if (f.active && Math.hypot(f.x - boat.x, f.z - boat.z) < 3.4 && Math.abs(f.y - boat.y) < 2.5){ f.active = false; f.timer = 3; aboard++; toast('Golden fish +1'); splash(f.x, f.y, f.z, 14, 0.5); }
    setObj(f.id, [f.x, f.y, f.z], quatYPR(f.yaw, pitch, 0), 1.6, simT * 7, f.vis); }
  if (aboard > 0 && Math.hypot(boat.x - PIER_END[0], boat.z - PIER_END[1]) < 36){ delivered += aboard; toast(`Delivered ${aboard} fish to the village`); aboard = 0; }
  // gulls
  for (const g of gulls){ g.cx = lerp(g.cx || boat.x, boat.x, 1 - Math.exp(-0.4 * dt)); g.cz = lerp(g.cz || boat.z, boat.z, 1 - Math.exp(-0.4 * dt)); g.a += g.w * dt;
    g.flapT -= dt; if (g.flapT < 0) g.flapT = rr(3, 7); const flapping = g.flapT < 1.0; g.flap += dt * (flapping ? 9 : 0.8);
    const x = g.cx + Math.cos(g.a) * g.R, z = g.cz + Math.sin(g.a) * g.R, y = Math.max(seaAt(x, z, simT).y + 6, g.h + Math.sin(simT * 0.3 + g.R) * 3);
    const yaw = Math.atan2(-Math.sin(g.a) * Math.sign(g.w), Math.cos(g.a) * Math.sign(g.w));
    setObj(g.id, [x, y, z], quatYPR(yaw, 0, -Math.sign(g.w) * 0.35), 1.7, g.flap, 1); }
  // flotilla
  const pa = Math.atan2(boat.z, boat.x);
  for (const b of flotilla){ const a = pa + b.da / 1250, r = routeR(a) + b.dr, tx = r * Math.cos(a), tz = r * Math.sin(a);
    if (!b.init){ b.x = tx; b.z = tz; b.init = true; }
    const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz), mv = Math.min(d, 13 * dt) + Math.min(d, 1) * 0; if (d > 0.01){ b.x += dx / d * Math.max(mv, Math.min(d, 6 * dt)); b.z += dz / d * Math.max(mv, Math.min(d, 6 * dt)); }
    const ta = a + 0.01, yawT = Math.atan2(-Math.sin(ta), Math.cos(ta)); b.yaw = b.yaw ? b.yaw + wrapA(yawT - b.yaw) * Math.min(1, dt * 1.5) : yawT;
    const fx = Math.sin(b.yaw), fz = Math.cos(b.yaw), hb = envWater(b.x + fx * 6, b.z + fz * 6), hs = envWater(b.x - fx * 6, b.z - fz * 6), hc = envWater(b.x, b.z);
    const hl = envWater(b.x + fz, b.z - fx), hr = envWater(b.x - fz, b.z + fx);
    b.y = (hb + hs + hc * 2) / 4; setObj(b.id, [b.x, b.y, b.z], quatYPR(b.yaw, -Math.atan2(hb - hs, 12), Math.atan2(hl - hr, 2) * 0.7), 1, simT * 2.4, 1);
    if (rnd() < 0.5) emit(b.x + fx * 7, b.y, b.z + fz * 7, fz * rr(-1, 1), 0, -fx * rr(-1, 1), rr(2, 3.5), rr(0.25, 0.5), 1); }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  $('aboard').textContent = aboard; $('deliv').textContent = delivered;
}

// ---------- camera
const VP = new Float32Array(16), PM = new Float32Array(16), VM = new Float32Array(16); const FOV = 55 * PI / 180, FAR = 20000; let fovY = FOV;
function updateCamera(dt){
  let eye, target;
  if (window.GW && GW.camOverride){ eye = GW.camOverride.eye; target = GW.camOverride.target; }
  else if (tour){ const t = simT - tourT0, fp = [boat.x, boat.y, boat.z];
    const a = t * 0.05 + boat.yaw + 2.2, R = 150 + 115 * Math.sin(t * 0.083), h = 16 + 75 * (0.5 + 0.5 * Math.sin(t * 0.061 + 1.0));
    eye = [fp[0] + Math.cos(a) * R, h, fp[2] + Math.sin(a) * R];
    const w = 0.5 + 0.5 * Math.sin(t * 0.045 - 1.2); target = [lerp(fp[0], 0, w * 0.85), lerp(fp[1] + 2, 120, w * 0.85), lerp(fp[2], 0, w * 0.85)];
  } else {
    camState.yaw += wrapA(boat.yaw + camYawOff - camState.yaw) * (1 - Math.exp(-2.5 * dt));
    const fx = Math.sin(camState.yaw), fz = Math.cos(camState.yaw), cp = Math.cos(camPitch), spch = Math.sin(camPitch);
    target = [boat.x + fx * 3, boat.y + 1.6, boat.z + fz * 3];
    eye = [target[0] - fx * camDist * cp, target[1] + camDist * spch + 1.5, target[2] - fz * camDist * cp];
  }
  const ground = Math.max(seaAt(eye[0], eye[2], simT).y + heroLift(eye[0], eye[2]), terrainH(eye[0], eye[2])) + 1.6;
  if (eye[1] < ground) eye[1] = ground;
  camState.eye = eye; camState.target = target;
  resize(); const asp = canvas.width / canvas.height; fovY = Math.min(1.45, Math.max(FOV, 2 * Math.atan(Math.tan(0.56) / asp))); persp(PM, fovY, asp, 0.3, FAR); lookAt(VM, eye, target, [0, 1, 0]); mmul(VP, PM, VM);
}

// ---------- render
let resScale = 1, strokeCount = 0;
const dprBase = isMobile ? (devicePixelRatio || 1) : Math.min(devicePixelRatio || 1, 2);
function resize(){ const s = dprBase * resScale, W = Math.max(1, Math.round(innerWidth * s)), H = Math.max(1, Math.round(innerHeight * s)); if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; } }
const WA = new Float32Array(24), WBu = new Float32Array(24);
WAVES.forEach((w, i) => { WA.set([w.dx, w.dz, w.k, w.A], i * 4); WBu.set([w.Q, w.w, w.ph, 0], i * 4); });
function common(p){
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u('uVP'), false, VP); gl.uniform3fv(p.u('uCam'), camState.eye); gl.uniform1f(p.u('uTime'), simT);
  const px = dprBase * resScale; gl.uniform1f(p.u('uFocal'), 0.5 * canvas.height / Math.tan(fovY / 2)); gl.uniform1f(p.u('uMinPx'), 2.2 * px); gl.uniform1f(p.u('uMaxPx'), 140 * px);
  gl.uniform1f(p.u('uFC'), 2 / Math.log2(FAR + 1)); gl.uniform1f(p.u('uSQKA'), SQKA); gl.uniform3fv(p.u('uSun'), SUN); gl.uniform3fv(p.u('uPal'), PALF);
  gl.uniform2f(p.u('uVil'), VIL[0], VIL[1]); gl.uniform4fv(p.u('uWA'), WA); gl.uniform4fv(p.u('uWB'), WBu); gl.uniform1i(p.u('uNoHaze'), 0); gl.uniform1i(p.u('uA2C'), samples > 0 ? 1 : 0);
}
function band(L){ const ro = KB * S0 * Math.pow(2, L), ri = L === 0 ? -1 : KB * S0 * Math.pow(2, L - 1); return L === 0 ? [-2, -1, ro * 0.75, ro] : [ri * 0.5, ri * 0.72, ro * 0.75, ro]; }
function drawField(layer, levels, sparse){
  const p = progF; gl.uniform1i(p.u('uLayer'), layer);
  const n = sparse ? NG / 2 : NG; gl.uniform1i(p.u('uN'), n);
  for (let L = 0; L < levels; L++){ const s = S0 * Math.pow(2, L) * (sparse ? 2 : 1); gl.uniform1f(p.u('uS'), s);
    gl.uniform2i(p.u('uOrig'), Math.floor(camState.eye[0] / s), Math.floor(camState.eye[2] / s)); gl.uniform4fv(p.u('uBand'), band(L)); gl.uniform1ui(p.u('uSeedL'), layer * 1000 + L * 37 + 11);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n * n); strokeCount += n * n; } }
function render(){
  resize(); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.937, 0.894, 0.784, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
  if (samples > 0) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  strokeCount = 0;
  // objects + sky
  common(progO); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, objTex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 5, OBJ_ROWS, gl.RGBA, gl.FLOAT, objData); gl.uniform1i(progO.u('uObj'), 0);
  gl.uniform1i(progO.u('uSky'), 0); gl.bindVertexArray(vaoObj); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, OBJ_N); strokeCount += OBJ_N;
  if (PB.n > 0){ gl.bindBuffer(gl.ARRAY_BUFFER, pBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, PB.f, 0, PB.n * 24); gl.bindVertexArray(vaoP); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, PB.n); strokeCount += PB.n; }
  gl.uniform1i(progO.u('uSky'), 1); gl.uniform1i(progO.u('uNoHaze'), 1); gl.bindVertexArray(vaoSky); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, SKY.n); strokeCount += SKY.n;
  // fields
  common(progF); gl.bindVertexArray(vaoField);
  drawField(1, CFG.landLv, false); drawField(0, CFG.waterLv, false); drawField(3, CFG.landLv, true); drawField(2, CFG.crestLv, true);
  // hero waves
  common(progH); gl.bindVertexArray(vaoHero); gl.uniform3f(progH.u('uHSeg'), HSEG[0], HSEG[1], HSEG[2]);
  for (const h of heroes){ if (h.p <= 0.005 || h.p >= 0.999) continue; gl.uniform4f(progH.u('uHW'), h.ox, h.oz, h.ang, h.p); gl.uniform4f(progH.u('uHW2'), h.Hmax, h.W, CFG.heroNu, 0);
    for (const o of [0, 1]){ gl.uniform1i(progH.u('uHOut'), o); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, HERO_N); strokeCount += HERO_N; } }
  gl.bindVertexArray(null);
}

// ---------- loop + adaptive resolution
const noAdapt = Q.has('noadapt') || TEST; let fpsT = 0, fpsN = 0, fps = 60, adaptCd = 3, last = performance.now(), running = !TEST;
function statsText(){ return `${fps.toFixed(0)} fps · res ${(resScale * 100).toFixed(0)}% · ${(strokeCount / 1000).toFixed(0)}k strokes · ${tierName} · ${physNote}`; }
function frame(now){
  if (!running) return; requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0.001, 0.05); last = now;
  try { update(dt); updateParticles(dt, tour ? camState.target : [boat.x, boat.y, boat.z]); updateCamera(dt); render(); } catch (e){ showErr(e.stack || e); running = false; return; }
  fpsT += Math.min(0.5, (now - (frame.prev || now)) / 1000); frame.prev = now; fpsN++;
  if (fpsT > 1){ fps = fpsN / fpsT; fpsT = 0; fpsN = 0; adaptCd -= 1;
    if (!noAdapt && adaptCd <= 0){ if (fps < 42 && resScale > 0.45){ resScale = Math.max(0.45, resScale * 0.85); adaptCd = 2; } else if (fps > 57 && resScale < 1){ resScale = Math.min(1, resScale * 1.08); adaptCd = 3; } }
    $('stats').textContent = statsText(); }
}
window.GW = {
  advance(sec, dt = 1/30){ for (let t = 0; t < sec; t += dt){ update(dt); updateParticles(dt, tour ? camState.target : [boat.x, boat.y, boat.z]); updateCamera(dt); } },
  cameraStep(dt = 1/30){ updateCamera(dt); return Array.from(VP).map(v => +v.toFixed(4)).concat(camState.target.map(v => +v.toFixed(3))); },
  draw(){ render(); gl.finish(); $('stats').textContent = statsText(); return strokeCount; },
  setTour, setAuto, set cam(v){ [camYawOff, camPitch, camDist] = v; }, press(code, on){ keys[code] = on; }, jump(){ jumpReq = true; },
  get state(){ return { boat: { x: boat.x, y: boat.y, z: boat.z, yaw: boat.yaw, speed: boat.speed, air: boat.air }, aboard, delivered, phys: physNote, strokes: strokeCount, objStrokes: OBJ_N, heroes: heroes.map(h => +h.p.toFixed(2)), tier: tierName, samples, res: resScale, fps, adaptCd, noAdapt }; },
  pierEnd: PIER_END, heroes, boatRef: boat, teleport(x, z, yaw){ const s = { x, y: envWater(x, z), z, yaw, speed: 0 }; phys = (phys instanceof RapierBoat) ? new RapierBoat(phys.R, s) : new SimpleBoat(s); Object.assign(boat, phys.pose()); camState.yaw = yaw; }
};
updateCamera(0.016);
setTimeout(() => { $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 700); }, 150);
window.GW.ready = true;
if (running) requestAnimationFrame(t => { last = t; frame(t); });
}
</script>
